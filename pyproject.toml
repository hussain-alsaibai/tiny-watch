[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-watch"
version = "1.0.0"
description = "Zero-dependency file watcher with debounce, coalescing, and glob filtering for Python."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}
]
keywords = ["file-watcher", "hot-reload", "dev-server", "auto-reload", "glob", "debounce"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-watch"
Repository = "https://github.com/hussain-alsaibai/tiny-watch"
